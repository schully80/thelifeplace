# Wrangler configuration example for Cloudflare deployment
# If you use Cloudflare KV for sessions (Astro session driver = cloudflare-kv-binding),
# you must bind a KV namespace named `SESSION` (or set the binding name in your Astro config).
# Create a KV namespace in your Cloudflare account and add the binding here.

name = "thelifeplace"
main = "./dist/worker.mjs"
compatibility_date = "2024-01-01"

# Example KV binding
[[kv_namespaces]]
binding = "SESSION"
id = "f424226aa91b4922ac009aa3b222f231"

# Add any other bindings (e.g., other KV namespaces, secrets) as needed.
# For guidance, see Cloudflare Workers + Wrangler docs.
