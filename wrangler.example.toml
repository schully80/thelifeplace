# Wrangler configuration example for Cloudflare deployment
# If you use Cloudflare KV for sessions (Astro session driver = cloudflare-kv-binding),
# you must bind a KV namespace named `SESSION` (or set the binding name in your Astro config).
# Create a KV namespace in your Cloudflare account and add the binding here.

name = "thelifeplace"
main = "./dist/worker.mjs"
compatibility_date = "2024-01-01"

# Example KV binding
[[kv_namespaces]]
binding = "SESSION"
id = "<your-kv-namespace-id>"  # replace with the real namespace id

# Add any other bindings (e.g., other KV namespaces, secrets) as needed.
# For guidance, see Cloudflare Workers + Wrangler docs.

# WhatsApp (optional, used for Plan a Visit confirmations)
# Set the token via: wrangler secret put WHATSAPP_TOKEN
# Set these vars via dashboard or [vars] block:
# WHATSAPP_ENABLED = "true"
# WHATSAPP_PHONE_ID = "<your_whatsapp_phone_number_id>"
# WHATSAPP_API_VERSION = "v19.0" # optional, defaults to v19.0

# CSRF (registration). Set to "true" to disable CSRF validation if your static HTML
# isn't receiving injected tokens. Turnstile + honeypot remain in place.
# REGISTER_CSRF_DISABLED = "true"
